events {}

http {
    # Docker embedded DNS server for service-name resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;


    server {
        listen 80;
        server_name localhost;

        location /api/user/ {
            set $user_service http://user-service:3000;
            proxy_pass $user_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keep OTP routes stable for frontend clients.
        location /api/otp/ {
            set $user_service http://user-service:3000;
            proxy_pass $user_service/api/otp/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth/ {
            set $user_service http://user-service:3000;
            proxy_pass $user_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/message/ {
            set $messaging_service http://messaging-service:3001;
            proxy_pass $messaging_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/appointment/ {
            set $appointment_service http://appointment-service:3002;
            proxy_pass $appointment_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}